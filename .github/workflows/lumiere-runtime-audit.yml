name: Lumière Runtime Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lumiere-runtime-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install playwright@1.48.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1

      - name: Run runtime audit v2
        run: node audit.js

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumiere-runtime-audit
          path: |
            audit-output/
          retention-days: 14

      - name: Print summary
        if: always()
        run: |
          if [ -f audit-output/summary.json ]; then
            echo "=== SUMMARY ==="
            cat audit-output/summary.json
          else
            echo "❌ audit-output/summary.json não encontrado"
            ls -la
          fi
